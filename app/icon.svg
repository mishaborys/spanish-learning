<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Red background (Spanish flag top + bottom) -->
  <rect width="32" height="32" rx="6" fill="#AA151B"/>
  <!-- Yellow middle stripe -->
  <rect y="8" width="32" height="16" fill="#F1BF00"/>
  <!-- ES text -->
  <text
    x="16" y="16"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="12"
    letter-spacing="0.5"
    fill="#AA151B"
  >ES</text>
</svg>
